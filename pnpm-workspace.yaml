# Allowlist of packages whose install scripts may run (pnpm 10 blocks all by
# default). electron's postinstall downloads the platform binary — without it,
# desktop mode fails with "Electron failed to install correctly".
onlyBuiltDependencies:
  - electron
  - esbuild

# Transitive security fixes (pnpm audit): parents have not bumped these yet.
# Drop an entry once its parent (cheerio → undici, express → qs,
# express-rate-limit → ip-address) ships the fixed range itself.
overrides:
  undici: '>=7.29.1'
  qs: '>=6.16.0'
  ip-address: '>=10.7.1'
